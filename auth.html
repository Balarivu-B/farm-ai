<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmEase AI - Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.5 1 9.8a7 7 0 0 1-9 8.2z"></path>
                    <path d="M9 22v-4h4"></path>
                </svg>
            </div>
            <span class="logo-text">FarmEase AI</span>
        </div>
        
        <nav id="main-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="features.html">Features</a>
            <a href="index.html#contact-section">Contact</a>
        </nav>

        <div class="auth-container">
            <span class="welcome-text">Welcome, Guest</span>
            <a href="auth.html" class="btn-auth">Login / Register</a>
        </div>
    </header>

    <main class="content-section">
        <div class="auth-card">
            <!-- Tabs Control System -->
            <div class="auth-tabs">
                <button type="button" id="tab-login" class="tab-btn active">Login</button>
                <button type="button" id="tab-register" class="tab-btn">Register</button>
            </div>

            <!-- Login View -->
            <div id="form-login" class="auth-form-container active-form">
                <div class="badge">Sign In</div>
                <h2>Welcome Back</h2>
                <form id="actual-login-form">
                    <input type="email" placeholder="Email Address" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>

            <!-- Registration View -->
            <div id="form-register" class="auth-form-container">
                <div class="badge">Join Us</div>
                <h2>Create Account</h2>
                <form id="actual-register-form">
                    <input type="text" placeholder="Full Name" required>
                    <input type="email" placeholder="Email Address" required>
                    <input type="password" placeholder="Create Password" required>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
